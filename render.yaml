services:
  - type: web
    name: villa-elena
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_NAME
        value: Villa Elena
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_TIMEZONE
        value: Asia/Manila
      - key: APP_URL
        sync: false
      - key: RUN_MIGRATIONS
        value: false

      # Render has no persistent disk, so storage/logs/laravel.log (the
      # default) is invisible in the dashboard's Logs tab. stderr goes
      # straight into that log stream instead.
      - key: LOG_CHANNEL
        value: stderr

      # Aiven MySQL — fill in from the Aiven console. Add these as secrets
      # in the Render dashboard rather than committing real values here.
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: AIVEN_CA_CERT
        sync: false
      - key: MYSQL_ATTR_SSL_CA
        value: /etc/ssl/certs/aiven-ca.pem

      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync

      # Cloudinary storage for property images (leave blank = local disk,
      # which is fine only until the container restarts).
      - key: CLOUDINARY_URL
        sync: false

      # Realtime dashboard — set BROADCAST_CONNECTION to "pusher" once the
      # keys below are filled in.
      - key: BROADCAST_CONNECTION
        value: log
      - key: PUSHER_APP_ID
        sync: false
      - key: PUSHER_APP_KEY
        sync: false
      - key: PUSHER_APP_SECRET
        sync: false
      - key: PUSHER_APP_CLUSTER
        value: ap1

      # PayMongo test-mode keys
      - key: PAYMONGO_PUBLIC_KEY
        sync: false
      - key: PAYMONGO_SECRET_KEY
        sync: false
      - key: PAYMONGO_WEBHOOK_SECRET
        sync: false

      # AI chatbot
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

      # Reuse the same Gmail SMTP + App Password already validated locally.
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: 587
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false

      # Free-tier cron workaround — see routes/web.php /cron/run-schedule.
      - key: CRON_SECRET
        generateValue: true
