services:
  - type: web
    name: villa-elena
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_NAME
        value: Villa Elena Resort
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_TIMEZONE
        value: Asia/Manila
      - key: APP_URL
        sync: false
      - key: RUN_MIGRATIONS
        value: false

      # Render has no persistent disk, so storage/logs/laravel.log (the
      # default) is invisible in the dashboard's Logs tab. stderr goes
      # straight into that log stream instead.
      - key: LOG_CHANNEL
        value: stderr

      # Aiven MySQL — fill in from the Aiven console. Add these as secrets
      # in the Render dashboard rather than committing real values here.
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: AIVEN_CA_CERT
        sync: false
      - key: MYSQL_ATTR_SSL_CA
        value: /etc/ssl/certs/aiven-ca.pem

      - key: SESSION_DRIVER
        value: database
      # config/session.php reads this via env() with no default, so leaving it
      # unset means null — and the session + "Keep me signed in" cookies go out
      # without the Secure flag. The remember-me cookie is an authentication
      # credential with a 400-day lifetime (Laravel's $rememberDuration =
      # 576000 minutes), so it must never be transmittable over plain http.
      # Render serves only https today; this is what keeps that true if a
      # plain-http request ever reaches the app.
      - key: SESSION_SECURE_COOKIE
        value: true
      # Redis first, MySQL whenever Redis can't answer (project.md v7.4).
      # Like this web service, the Key Value instance was created by hand
      # in the dashboard, not from this file: Free plan, Singapore (same
      # region as this service), internal-only. REDIS_URL is its INTERNAL
      # URL (redis://red-...:6379), which resolves only inside Render's
      # private network.
      - key: CACHE_STORE
        value: failover
      - key: REDIS_CLIENT
        value: predis
      - key: REDIS_URL
        sync: false
      - key: REDIS_CACHE_DB
        value: "0"
      - key: REDIS_TIMEOUT
        value: "0.5"
      - key: QUEUE_CONNECTION
        value: sync

      # Cloudinary storage for property images (leave blank = local disk,
      # which is fine only until the container restarts).
      - key: CLOUDINARY_URL
        sync: false

      # Realtime dashboard. This MUST be "pusher" — it sat at "log" while the
      # Pusher keys below were already filled in, which disables the bell and
      # every live dashboard update *silently*: nothing errors, the events
      # just go to the log channel and no browser ever hears them.
      - key: BROADCAST_CONNECTION
        value: pusher
      - key: PUSHER_APP_ID
        sync: false
      - key: PUSHER_APP_KEY
        sync: false
      - key: PUSHER_APP_SECRET
        sync: false
      - key: PUSHER_APP_CLUSTER
        value: ap1

      # PayMongo test-mode keys
      - key: PAYMONGO_PUBLIC_KEY
        sync: false
      - key: PAYMONGO_SECRET_KEY
        sync: false
      - key: PAYMONGO_WEBHOOK_SECRET
        sync: false

      # AI chatbot, insights, forecast, review moderation, and the prescriptive
      # briefing. Pin GROQ_MODEL to whatever local dev is actually tested
      # against — leaving it unset falls back to config/services.php's default,
      # so production quietly runs a different model than the one that was
      # verified. Groq retires models on a rolling basis (see project.md v5.8):
      # check GET https://api.groq.com/openai/v1/models before changing it.
      - key: GROQ_MODEL
        value: qwen/qwen3.6-27b
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

      # Render's free plan blocks outbound SMTP ports entirely (25/465/587,
      # any host) — Brevo's HTTPS API is used instead. See MAILER_DSN and
      # config/mail.php's 'brevo' mailer / AppServiceProvider::boot().
      - key: MAIL_MAILER
        value: brevo
      - key: MAILER_DSN
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      # Without this, config/mail.php's default applies and every booking
      # confirmation goes out from a sender literally named "Example".
      - key: MAIL_FROM_NAME
        value: Villa Elena Resort

      # Free-tier cron workaround — see routes/web.php /cron/run-schedule.
      - key: CRON_SECRET
        generateValue: true
