; Villa Elena — PHP runtime overrides for the production container.
;
; THE IMAGE HAS NO php.ini AT ALL. `php:8.2-fpm-alpine` ships
; php.ini-development and php.ini-production but activates neither, so
; `php -i` reports "Loaded Configuration File => (none)" and every setting is
; PHP's compiled default. That is how the three layers ended up disagreeing
; about how big an upload may be:
;
;     nginx client_max_body_size   20M
;     PHP  upload_max_filesize      2M   <- compiled default
;     PHP  post_max_size            8M   <- compiled default
;     Laravel `max:3048`           ~3M
;
; The visible damage was not a rejection, it was a LIE about the reason. A
; 2-3 MB avatar — which the app's own rule accepts — died with "The avatar
; failed to upload.", because PHP refused it before Laravel ever saw a file
; and Laravel has no way to tell that apart from a truncated transfer. Worse
; on the property form: past post_max_size PHP discards the whole request
; body, `_token` goes with it, and the admin gets "419 Page Expired" — a size
; problem wearing a CSRF problem's clothes.
;
; This file is loaded from conf.d, which IS scanned without a main php.ini.
;
; ── The numbers, and why these ones ────────────────────────────────────
;
; They are derived from the form's promise, not the other way round. The
; binding limit must be Laravel's, because Laravel is the only layer that can
; explain itself to the person uploading.
;
;   per file      3 MB   Laravel `max:3048`, unchanged — the product decision
;   upload_max    4 MB   headroom ABOVE Laravel's rule, so a slightly oversized
;                        file is rejected by Laravel ("may not be greater than
;                        3MB") instead of vanishing into PHP's generic error
;   per request   10 images x 3 MB = 30 MB  (`images|array|max:10`)
;   post_max     32 MB   the request ceiling, with room for the form fields
;
; nginx's client_max_body_size is set to the same 32M. Keep all four in step:
; if you want 20 images per batch again, post_max_size and client_max_body_size
; both need to reach ~64M, which is a real cost on a free-tier container — that
; trade is why the batch is 10.

upload_max_filesize = 4M
post_max_size = 32M

; Already the default; pinned so the 10-image batch cannot be broken by a
; change in the base image.
max_file_uploads = 20

; ── Error output ───────────────────────────────────────────────────────
;
; The same "no main php.ini" fact explained at the top of this file has a
; second consequence, and it is a disclosure one. PHP's COMPILED defaults
; apply, and they are not the production ones. Measured with `php -n`, which
; is the same "no ini file" state the container runs in:
;
;     display_errors           '1'
;     display_startup_errors   '1'
;     expose_php               '1'
;     log_errors               '0'
;
; `php.ini-production` is what normally turns the first two off; the image
; ships it but activates neither it nor php.ini-development.
;
; HOW BIG THE WINDOW ACTUALLY IS — stated precisely, because it is narrower
; than it looks and the fix should not be oversold. Laravel itself calls
; ini_set('display_errors', 'Off') while booting
; (HandleExceptions::bootstrap, framework src line 56), so anything Laravel
; lives to handle is already off. What is left is everything BEFORE that:
; a composer autoload failure, a syntax error in a bootstrap file, an
; extension that fails to load. Those print the message and the absolute
; path into the response body, and APP_DEBUG has no say in it because no
; Laravel code has run yet. `display_startup_errors` is exactly that class.
display_errors = Off
display_startup_errors = Off

; And the other half of that pair: with log_errors at its compiled '0', a
; pre-boot error was shown to the visitor and recorded NOWHERE. stderr is
; where Render's Logs tab reads from (LOG_CHANNEL=stderr in render.yaml), so
; sending PHP's own errors to the same place puts them next to Laravel's.
log_errors = On
error_log = /dev/stderr

; `X-Powered-By: PHP/8.2.34` was on every production response — measured
; against the live site, which is also how the missing php.ini was confirmed
; independently of reading this file. It tells an attacker which patch level
; to look up and buys us nothing.
expose_php = Off
